name: Deploy dashboard to Aliyun OSS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dashboard-oss-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rebuild dashboard data from Excel history
        run: python tools/build_dashboard_data.py data/source --output data/dashboard-data.json

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build

      - name: Verify OSS secrets
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: |
          if [ -z "$ALIYUN_OSS_ACCESS_KEY_ID" ] || [ -z "$ALIYUN_OSS_ACCESS_KEY_SECRET" ]; then
            echo "Missing ALIYUN_OSS_ACCESS_KEY_ID or ALIYUN_OSS_ACCESS_KEY_SECRET repository secret."
            exit 1
          fi

      - name: Upload static website to Aliyun OSS
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: python scripts/deploy_oss.py --directory out

      - name: Publish summary
        run: |
          echo "## OSS deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bucket: seller-sprite-dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "- Region: cn-beijing" >> "$GITHUB_STEP_SUMMARY"
          echo "- Website: https://sellersprite.uwant.cc/" >> "$GITHUB_STEP_SUMMARY"
